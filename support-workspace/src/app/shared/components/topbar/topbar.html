<header class="topbar">

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <span>Workspace</span>

    <span class="separator">/</span>

    <span class="current">
      Dashboard
    </span>
  </div>


  <!-- Right Actions -->
  <div class="topbar-actions">

    <!-- Search -->
    <div class="search-box">

      <svg
        class="search-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <input
        type="text"
        placeholder="Search requests..."
      />

      <span class="shortcut">
        Ctrl K
      </span>

    </div>


    <!-- Notifications -->
    <button
      class="icon-button"
      type="button"
      aria-label="Notifications"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
        ></path>

        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>

      <span class="notification-dot"></span>

    </button>


    <!-- User -->
    <button
      class="topbar-user"
      type="button"
    >

      <div class="user-avatar">
        HM
      </div>

      <div class="user-details">
        <strong>
          Helda Mounir
        </strong>

        <span>
          Support Agent
        </span>
      </div>

      <svg
        class="chevron"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 9 6 6 6-6"></path>
      </svg>

    </button>

  </div>

</header>
